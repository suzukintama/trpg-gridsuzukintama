<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>リプレイ</title>
<!--
  リプレイ（2026-11-05 先生の依頼「ノベルリプレイは、完全に単品物としてツール自体を分けて出してほしい」）。
  VTT の「完全書き出し」（E48）のファイルを読み、卓で起きたことを行ごとに見返す 1 ファイルの道具。
  仕様は _drafts/リプレイ単体ツール_仕様_2026-11-05.md。読むだけで、何も書き込まない（通信なし・localStorage なし）。
  見え方の判定は VTT の template.html の _canSeeSecret・_sysPlSees・_seeSecrets・_whHintRows・_sdiceStubOk、
  舞台の組み方は _rplBuild・_rplSlotVM・_rplVals、判定の要約は _judgeSum、駒の見た目は renderVals の駒の部分を写した。
  行の場面の見た目（sc の k・tn・vg・ft）は _rplSceneRef、駒と HP・状態・背景と立ち絵の差し替えの記録（doc.evlog）は _evTrack の形を読む（2026-11-05 lane-rplfull）。
  VTT の側を直したら、ここの写しも合わせる。
-->
<style>
  :root {

    --sf-1: #1b212c; --sf-2: #232b39;
    --ln-1: #242c3a; --ln-2: #333d4e; --ln-3: #62738d;
    --tx-1: #e8ecf4; --tx-2: #b7c0d0; --tx-3: #8b96a8; --tx-disabled: #6e7990;
    --ac: #3aa0a6; --ac-ink: #06171a; --ac-tx: #6fdbe2; --ac-sf: #17303a; --ac-ln: #2f4a5a;
    --ok: #6fe3a6; --warn: #e6b243; --warn-sf: #241c08; --bad: #ef8177; --gm: #e0a13a; --secret: #ff5c8a;

    color-scheme: dark;

  body { display: flex; flex-direction: column; min-width: 0; min-height: 0; overflow: hidden; }
  button, select, input { font: inherit; }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 28px; padding: 0 11px; background: var(--sf-1);

  .msg.sys .bub { background: transparent; border: 0; padding: 2px 0; font-size: 12px; color: var(--tx-3); }
  .msg .sectag { display: inline-flex; padding: 1px 8px; margin-bottom: 4px; background: #3a2f12; border: 1px solid var(--warn-sf); border-radius: var(--rd-1); font-size: 11px; font-weight: 700; color: var(--warn); }

  .badge { display: inline-block; margin-left: 6px; padding: 0 6px; border-radius: var(--rd-1); font-size: 11px; font-weight: 700; }

  #mapv .wrap { flex: 1; min-height: 0; overflow: auto; position: relative; }
  .board { position: relative; transform-origin: 0 0; background-color: #0e1218; }

  .tok .hid { position: absolute; bottom: 100%; left: 50%; transform: translateX(-50%); margin-bottom: 2px; padding: 0 5px; background: var(--warn-sf); border: 1px solid var(--warn); border-radius: var(--rd-1); font-size: 10px; color: var(--warn); white-space: nowrap; }
  .tok[data-speak="1"]::after { content: ""; position: absolute; inset: -7px; border-radius: 50%; border: 3px solid var(--ac-tx); box-shadow: 0 0 14px var(--ac); pointer-events: none; }
  .tok[data-out="1"] { filter: grayscale(1) brightness(.55); }
  .tok .hpb { position: absolute; left: 4%; right: 4%; bottom: 2px; height: 12px; background: rgba(10,12,17,.82); border: 1px solid var(--ln-2); border-radius: 2px; overflow: hidden; pointer-events: none; }
  .tok .hpb span { position: absolute; left: 0; top: 0; bottom: 0; }
  .tok .hpb b { position: relative; display: block; font-size: 9.5px; line-height: 10px; text-align: center; color: #fff; text-shadow: 0 0 2px #000, 0 0 2px #000; font-weight: 700; }
  .tok .cond { position: absolute; top: -2px; right: -10px; max-width: 90px; padding: 0 4px; background: #3a2a10; border: 1px solid #7a5c2a; border-radius: var(--rd-1); font-size: 10px; line-height: 14px; color: #ffd27d; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; pointer-events: none; z-index: 2; }
@keyframes pov-card { 0%,18% { opacity:0 } 45%,100% { opacity:1 } }
</style>

<body>
<header>
  <span class="title">リプレイ</span>

<main>
  <div id="pane">
    <div id="drop">
      <div class="box">
        <h1>セッションファイルを開く</h1>
        <p>VTT のヘッダーの「GM」から「完全書き出し」で保存したファイル（.json）を、上の「ファイルを開く」で選ぶか、この画面へドラッグする。</p>
        <p>開いたら「誰の目で見るか」を選ぶ。GM の目ではすべての行が出る。PL や観戦者の目では、その人が卓で見られた行だけが出る。</p>

<footer id="ctl" hidden>

    </select>
  </label>

  <span class="pos mono" id="pos">0 / 0</span>
  <span class="src" id="src"></span>
</footer>
<script>
(() => {
'use strict';
/* ============================== 共通 ============================== */
const CELL = 56;
const SPEEDS = [0.5, 1, 2, 4];
const VOLT_STAMPS = ['燃える', 'エモい', '最高', 'しね！', 'キモイ', 'えぐいて'];
const VOLT_STAMP_POS = 3;
const NV_TONES = { none: 'rgba(0,0,0,0)', night: 'rgba(18,32,92,.40)', alert: 'rgba(200,20,44,.28)', net: 'rgba(0,214,160,.20)' };
const NV_VIGS = { none: 0, weak: 0.5, strong: 1 };
const TOK_CLIP = { triangle: 'polygon(50% 0%, 100% 100%, 0% 100%)', diamond: 'polygon(50% 0%, 100% 50%, 50% 100%, 0% 50%)' };
const ITEM_DEFAULT_COLOR = '#e6b243';
const STAGE_T = /^(say|narration|dice|rolesk)$/;
const SHOW_T = /^(say|narration|dice|rolesk|system|bgm|announce|item)$/;
const $ = (id) => document.getElementById(id);
const arr = (v) => Array.isArray(v) ? v.filter(x => x != null) : (v && typeof v === 'object' ? Object.values(v).filter(x => x != null) : []);
function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  if (attrs) for (const k in attrs) {
    const v = attrs[k];
    if (v == null || v === false) continue;
    if (k === 'style' && typeof v === 'object') Object.assign(el.style, v);
    else if (k === 'class') el.className = v;
    else if (k === 'text') el.textContent = v;
    else if (k.slice(0, 2) === 'on') el.addEventListener(k.slice(2), v);
    else el.setAttribute(k, v === true ? '' : String(v));
  }
  for (const c of kids.flat()) { if (c == null || c === false) continue; el.appendChild(typeof c === 'string' ? document.createTextNode(c) : c); }
  return el;
}
// 画像の URL として使ってよい文字列か（data: と blob: と http(s): だけ）。CSS の url("…") に入れるので引用符を逃がす
function safeUrl(v) {
  if (typeof v !== 'string' || !v) return null;
  if (!/^(data:image\/|blob:|https?:)/i.test(v)) return null;
  return v.replace(/"/g, '%22').replace(/\\/g, '%5C').replace(/[\r\n]/g, '');
}
const urlCss = (u) => 'url("' + u + '")';
const hm = (ts) => { const d = new Date(ts || 0); return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0'); };
const initialOf = (s) => { const t = String(s == null ? '' : s); return t ? (Array.from(t)[0] || '') : ''; };

/* 名前の色の見やすさ（VTT の _nameColor と同じ。背景とのコントラスト比が 3 未満なら明るくする） */
const lum = (rgb) => { const f = (c) => { c /= 255; return c <= 0.03928 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4); }; return 0.2126 * f(rgb[0]) + 0.7152 * f(rgb[1]) + 0.0722 * f(rgb[2]); };
const contrast = (a, b) => { const x = lum(a), y = lum(b); return (Math.max(x, y) + 0.05) / (Math.min(x, y) + 0.05); };
function rgb2hsv(r, g, b) { r /= 255; g /= 255; b /= 255; const mx = Math.max(r, g, b), mn = Math.min(r, g, b), d = mx - mn; let hh = 0;
  if (d) { if (mx === r) hh = ((g - b) / d) % 6; else if (mx === g) hh = (b - r) / d + 2; else hh = (r - g) / d + 4; hh *= 60; if (hh < 0) hh += 360; }

function renderMap() {

      const face = h('div', { class: 'face', 'data-shape': shape, style: { borderColor: col, color: col, borderRadius: shape === 'square' ? '16%' : shape === 'circle' ? '50%' : '0', clipPath: TOK_CLIP[shape] || 'none',
        background: icon ? urlCss(icon) + ' ' + (50 + (Number(ch0.iconX) || 0)) + '% ' + (50 + (Number(ch0.iconY) || 0)) + '% / cover no-repeat' : 'var(--bg-1)', paddingTop: shape === 'triangle' ? '26%' : '0' }, text: icon ? '' : (t.mob && t.name ? (Array.from(t.name).slice(-1)[0] || '') : initialOf(ch.name)) });

          h('span', { style: { width: pct + '%', background: hpm[0] / hpm[1] <= 0.3 ? 'var(--bad)' : (ch.color || 'var(--ac)') } }),

// 時刻 T にこのマップにあった駒。書き出し時点の駒に記録をなぞって位置と HP・状態を当て、その後に消えた駒は記録から組み直す
function tokensAt(mp, T) {
  if (!evOn()) return mp.tokens.map(t => tokDecor(t, T));
  const fin = new Map();
  S.maps.forEach(m => m.tokens.forEach(t => { if (t && t.id != null) fin.set(String(t.id), { t, m: m.id }); }));
  const out = [];
  const ids = [...fin.keys()]; S.ev.info.forEach((_, id) => { if (!fin.has(id)) ids.push(id); });
  ids.forEach(id => {
    const f0 = fin.get(id), at = tokAt(id, T, f0 ? { m: f0.m } : null);
    if (!at) { if (f0 && f0.m === mp.id) out.push(tokDecor(f0.t, T)); return; }
    if (!at.on || at.m !== mp.id) return;
    let base = f0 ? f0.t : null;
    if (!base) {
      const inf = S.ev.info.get(id); if (!inf) return;
      base = { id, kind: inf.kind || 'char', charId: inf.c || null, name: inf.n || '', w: 1, h: 1, mob: (inf.kind || 'char') === 'char' && !!inf.n, _gone: true };
    }
    out.push(tokDecor({ ...base, x: at.x, y: at.y }, T));
  });
  return out;
}
// 駒に、その時点の HP と状態を添える（_hp・_cs）。キャラはキャラの記録、モブは駒の記録。記録が無ければ書き出し時点の値
function tokDecor(t, T) {
  if (!t || t.kind !== 'char') return t;
  const pick = (v, d) => v !== undefined ? v : d;
  if (t.mob) return { ...t, _hp: pick(evOn() ? valAt(S.ev.tokHp.get(String(t.id)), T) : undefined, hpOf(t.status)), _cs: pick(evOn() ? valAt(S.ev.tokCs.get(String(t.id)), T) : undefined, condOf(t)) };
  const ch = charById(t.charId);
  const cid = t.charId != null ? String(t.charId) : '';
  return { ...t, _hp: pick(evOn() ? valAt(S.ev.chHp.get(cid), T) : undefined, ch ? hpOf(ch.status) : ''), _cs: pick(evOn() ? valAt(S.ev.chCs.get(cid), T) : undefined, condOf(ch)) };
}
function shapeId(v, isObj) { return (v === 'circle' || v === 'triangle' || v === 'square' || v === 'diamond') ? v : (isObj ? 'square' : 'circle'); }

/* ============================== 操作 ============================== */
function seek(i) { const n = S.frames.length; if (!n) return; S.idx = Math.max(0, Math.min(n - 1, Number(i) || 0)); render(); arm(); }
function step(d) { seek(S.idx + d); }
function stopTimer() { clearTimeout(S.timer); S.timer = null; }
function togglePlay() {
  const n = S.frames.length; if (!n) return;
  S.play = !S.play;
  if (S.play && S.idx >= n - 1) S.idx = 0;
  render(); arm();
}
// 自動送りの次の一手。文の長さに応じて待ち、速さで割る（VTT の _rplArm と同じ）
function arm() {
  stopTimer();
  if (!S.play || !S.frames.length) return;
  const f = S.frames[S.idx];
  const len = f ? String(f.m.text || '').length : 0;
  const wait = f && f.sceneBreak ? 1100 : Math.min(7000, 1600 + len * 70) / (S.speed || 1);
  S.timer = setTimeout(() => {
    S.timer = null;
    if (!S.play) return;
    if (S.idx >= S.frames.length - 1) { S.play = false; render(); return; }
    S.idx++; render(); arm();
  }, wait);
}

let dragN = 0;
