<script id="novel-core">
(() => {
  function splitNovelMd(md) {
    const lines = md.replace(/^\uFEFF/, '').replace(/\r\n?/g, '\n').split('\n');
    const title = lines.shift().replace(/^# /, '').replace(/^試し書き：/, '').trim();
    const first = lines.indexOf('---'), last = lines.lastIndexOf('---');
    const body = lines.slice(first + 1, last > first ? last : undefined);
    const memo = body.findIndex(line => /^## 書いた人のメモ(?:\s|$)/.test(line));
    const paras = [];
    let chunk = '';
    function flush() { if (chunk) paras.push(chunk); chunk = ''; }
    for (let line of body.slice(0, memo < 0 ? undefined : memo)) {
      if (!line.trim()) { flush(); continue; }
      if (chunk.length + line.length + 1 > 4000) flush();
      while (line.length > 4000) {
        const cut = /[\uD800-\uDBFF]/.test(line[3999]) ? 3999 : 4000;
        paras.push(line.slice(0, cut));
        line = line.slice(cut);
      }
      chunk += (chunk ? '\n' : '') + line;
    }
    flush();
    return { title, paras };
  }
  function orderBetween(prev, next) {
    if (prev == null) return next == null ? 1000 : next - 1000;
    return next == null ? prev + 1000 : prev / 2 + next / 2;
  }
  function sortParas(obj) {
    return Object.entries(obj).map(([id, p]) => ({ ...p, id, del: !!p.del }))
      .sort((a,b) => a.o - b.o || (a.id < b.id ? -1 : a.id > b.id ? 1 : 0));
  }
  function fmtTime(ms) {
    const d = new Date(ms), pad = n => String(n).padStart(2,'0');
    return (d.getMonth()+1)+'月'+d.getDate()+'日 '+pad(d.getHours())+':'+pad(d.getMinutes());
  }
  globalThis.NovelCore = {
    splitNovelMd, orderBetween, sortParas, fmtTime,
    fmtDate(value){
      const match=/^(\d{4})-(\d{2})-(\d{2})$/.exec(value);
      return match ? match[1]+'年'+Number(match[2])+'月'+Number(match[3])+'日' : '';
    },
    cleanName: s => s.trim().replace(/\r\n|[\r\n]/g,' ').slice(0,20).replace(/[\uD800-\uDBFF]$/, ''),
    checkText: s => ({ ok: s.length <= 4000, len: s.length }),
    buildSeed: (paras, by, at) => Object.fromEntries(paras.map((t,i) =>
      ['p'+String(i+1).padStart(4,'0'), {t,o:(i+1)*1000,by,at}]))
  };
})();
</script>

<script>
'use strict';
const $ = s => document.querySelector(s);
const core = NovelCore, rows = $('#rows'), panel = $('#panel');
const state = {nid:null,paras:[],pres:[],connected:false};
window.__novel = {state,core};
const cid = Array.from(crypto.getRandomValues(new Uint8Array(6)), n=>n.toString(16).padStart(2,'0')).join('');
const emu = new URLSearchParams(location.search).get('emu');
const local = ['localhost','127.0.0.1'].includes(location.hostname);
if (emu !== null && (!local || !/^\d+$/.test(emu) || +emu<1 || +emu>65535)) throw Error('Invalid emulator URL');
firebase.initializeApp(emu ? {projectId:'demo-novel',databaseURL:'http://127.0.0.1:'+emu+'?ns=demo-novel'} : NOVEL_FB);
const db = firebase.database();
if(emu) db.useEmulator('127.0.0.1',Number(emu));
const stamp = firebase.database.ServerValue.TIMESTAMP;
let username='', gmKey='', index={}, session=null, selected=null, editor=null;
state.role='';
const siteTitle=document.title;
let toastTimer, grace=true, panelVersion=0;
const getPref=k=>localStorage.getItem('novel-'+k);
function pref(k,v){localStorage.setItem('novel-'+k,v); applyPrefs();}
function applyPrefs(){
  const light=(getPref('bg')||systemBg())==='light';
  document.documentElement.classList.toggle('light',light);
  $('#theme').textContent=light?'暗く':'明るく';
  $('#gm').hidden=state.role!=='gm';
  document.documentElement.style.setProperty('--size',({s:'16px',l:'21px'})[getPref('size')]||'18px');
  $('#name').textContent=username?'名前：'+username:'名前を入れる';
  if(session) for(const id of session.nodes.keys()) visibility(id);
  resize();
}
function el(tag,text,cls){const e=document.createElement(tag); if(text!=null)e.textContent=text;if(cls)e.className=cls;return e;}
function btn(label,fn,act,cls){const b=el('button',label,cls);if(act)b.dataset.act=act;b.onclick=fn;return b;}
function hideToast(){clearTimeout(toastTimer);$('#toast').hidden=true;}
function toast(msg,undo){
  hideToast();const box=$('#toast');box.replaceChildren(msg);box.hidden=false;
  if(undo)box.append(btn('戻す',undo,'undel'));toastTimer=setTimeout(hideToast,undo?6000:3000);
}
function error(){toast('送れなかった。もう一度押す。');}
function closePanel(){panelVersion++;if(panel.open) panel.close();}
function openPanel(title,cls=''){
  closePanel();panel.className=cls;panel.replaceChildren();
  const x=btn('×',closePanel,null,'close');x.setAttribute('aria-label','閉じる');
  panel.append(x,el('h2',title));panel.showModal();
}
panel.onclick=e=>{if(e.target===panel){const r=panel.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)closePanel();}};
panel.oncancel=e=>{e.preventDefault();closePanel();};
const systemBg=()=>matchMedia('(prefers-color-scheme: light)').matches?'light':'dark';
$('#theme').onclick=()=>pref('bg',document.documentElement.classList.contains('light')?'dark':'light');
matchMedia('(prefers-color-scheme: light)').addEventListener('change',applyPrefs);
const validName=n=>!!n && !/[.#$\[\]\/\u0000-\u001f\u007f]/.test(n);
async function verify(n){
  if(!validName(n))return '';
  if((await db.ref('novel/names/'+n).get()).val()===true)return 'pl';
  try{await gmUpdate({},n);return 'gm';}catch{return '';}
}
function identity(n,role){
  state.role=role;gmKey=role==='gm'?n:'';
  username=gmKey?'GM':role?n:'';
  for(const [key,value] of [['novel-gm',gmKey],['novel-name',role==='pl'?n:'']]){
    if(value)localStorage.setItem(key,value);else localStorage.removeItem(key);
  }
  applyPrefs();if(session)for(const id of session.nodes.keys())showActions(id);
  presence();
}
function gmUpdate(changes,key=gmKey){
  return db.ref('novel').update({...changes,['gm/'+key+'/stamp']:stamp});
}
function docUpdate(s,changes){
  if(state.role!=='gm')return s.ref.update(changes);
  return gmUpdate(Object.fromEntries(Object.entries(changes).map(([path,v])=>['docs/'+s.ref.key+'/'+path,v])));
}
function namePanel(next){
  openPanel('名前を入れる');
  const version=panelVersion,form=el('form'),input=el('input'),message=el('p');input.placeholder='登録されている名前';input.maxLength=20;input.value=gmKey?'':username;
  const send=el('button','これで始める','primary'),cancel=btn('やめる',closePanel);cancel.type='button';
  input.oninput=()=>send.disabled=!core.cleanName(input.value);input.oninput();
  form.append(input,send,cancel);panel.append(el('p','登録されている名前を入れると、書き換えられる。名前は GM が登録する。'),form,message);
  form.onsubmit=async e=>{
    e.preventDefault();const n=core.cleanName(input.value);if(!n||send.disabled)return;
    input.disabled=send.disabled=true;send.textContent='確かめている……';
    try{
      const role=await verify(n);if(version!==panelVersion)return;
      if(role){identity(n,role);closePanel();next?.();return;}
      message.textContent='その名前は登録されていない。GM に頼む。';
    }catch{error();}
    input.disabled=send.disabled=false;send.textContent='これで始める';input.focus();
  };input.focus();
}
async function named(fn){await identityReady;if(username)fn();else namePanel(fn);}
$('#name').onclick=async()=>{await identityReady;namePanel();};
$('#display').onclick=()=>{
  if(panel.open){closePanel();return;}openPanel('表示');
  for(const [label,key,def,options] of [['字の大きさ','size','m',[['s','小'],['m','中'],['l','大']]],['地の色','bg',systemBg(),[['dark','暗い'],['light','明るい']]]]){
    const group=el('div');panel.append(el('p',label),group);
    for(const [value,text] of options){
      const b=btn(text,()=>{pref(key,value);for(const other of group.children)other.setAttribute('aria-pressed',String(other===b));});
      b.setAttribute('aria-pressed',String(value===(getPref(key)||def)));group.append(b);
    }
  }
  const label=el('label'),check=el('input');check.type='checkbox';check.checked=getPref('showdel')==='1';
  check.onchange=()=>pref('showdel',check.checked?'1':'0');label.append(check,'消した段落も出す');panel.append(label);
};
function editingPid(){return editor?.pid||'';}
function presence(){
  if(session && state.connected && session.armed){
    const value={n:username,p:editingPid(),at:stamp};
    session.me.set(value).catch(error);
  }
}
async function arm(s){
  s.armed=false;
  try{await s.me.onDisconnect().remove();if(session===s && state.connected){s.armed=true;presence();}}catch{if(session===s)error();}
}
function connection(){ $('#offline').hidden=state.connected || grace; }
setTimeout(()=>{grace=false;connection();},3000);
db.ref('.info/connected').on('value',snap=>{
  state.connected=snap.val()===true;connection();
  if(session){session.armed=false;if(state.connected)arm(session);}
});
function visibility(id){
  const node=session.nodes.get(id);node.hidden=!!session.data[id].del && getPref('showdel')!=='1' && editor?.pid!==id;
}
function others(id){return state.pres.filter(p=>p.id!==cid && p.p===id).map(p=>p.n||'名前のない人');}
function badges(id){
  const node=session.nodes.get(id);if(!node)return;
  const p=session.data[id], texts=others(id).map(n=>n+'が書いている');
  if(p.del)texts.push('消した段落（'+p.by+'）');
  if(session.flashes.has(id))texts.push(session.flashes.get(id).text);
  node.querySelector('.badges').textContent=texts.join('　');
}
function flash(s,id,text){
  clearTimeout(s.flashes.get(id)?.timer);
  const node=s.nodes.get(id);node.classList.remove('flash');void node.offsetWidth;node.classList.add('flash');
  const timer=setTimeout(()=>{s.flashes.delete(id);if(session===s)badges(id);},4000);
  s.flashes.set(id,{text,timer});badges(id);
}
function showActions(id){
  const node=session?.nodes.get(id);if(!node)return;
  const p=session.data[id],a=node.querySelector('.actions');a.replaceChildren();
  node.classList.toggle('selected',selected===id);
  if(editor)return;
  if(p.del){
    a.append(btn('戻す',()=>named(()=>save(id,'undel')),'undel'));
    if(state.role==='gm')a.append(btn('完全に消す',async()=>{
      if(!confirm('履歴ごと消える。戻せない。消す？'))return;
      try{await docUpdate(session,{['paras/'+id]:null,['hist/'+id]:null});toast('完全に消した');}catch{error();}
    },'purge'));return;
  }
  if(selected!==id)return;
  a.append(btn('書き換える',()=>named(()=>start(id,'edit')),'edit','primary'),
    btn('この下に書き足す',()=>named(()=>start(id,'add')),'add'),btn('履歴',()=>historyPanel(id),'hist'),
    btn('消す',()=>named(()=>save(id,'del')),'del','quiet'));
}
function select(id){
  const old=selected;selected=id;showActions(old);showActions(id);
}
function receive(s,snap){
  if(s!==session)return;
  const id=snap.key,p=snap.val(),old=s.data[id];s.data[id]=p;
  let node=s.nodes.get(id);
  if(!node){
    node=el('article');node.dataset.pid=id;node.tabIndex=0;
    node.append(el('div','','badges'),el('div','','prose'),el('div','','actions'));
    const choose=()=>{if(!editor && !getSelection()?.toString())select(selected===id?null:id);};
    node.onclick=e=>{if(!e.target.closest('button,.editor'))choose();};
    node.onkeydown=e=>{if(e.target===node && ['Enter',' '].includes(e.key)){e.preventDefault();choose();}};
    s.nodes.set(id,node);
  }
  state.paras=core.sortParas(s.data);
  if(!old){
    const next=state.paras[state.paras.findIndex(v=>v.id===id)+1];
    rows.insertBefore(node,next?s.nodes.get(next.id):null);
  }
  node.querySelector('.prose').textContent=p.t;node.classList.toggle('deleted',!!p.del);
  visibility(id);showActions(id);badges(id);
  if(!s.ready || s.local===id || (old && old.t===p.t && old.by===p.by && !!old.del===!!p.del))return;
  flash(s,id,p.by+(!old?'が書き足した':p.del?'が消した':old.del?'が戻した':'が書き換えた'));
  if(editor?.kind==='edit' && editor.pid===id){
    editor.remote.replaceChildren(el('div','書いているあいだに、'+p.by+'がこの段落を書き換えた。このまま送ると自分の文が残り、'+p.by+'の文は履歴に入る。'),el('strong',p.by+'の文'),el('div',p.t,'prose'));
  }
}
function resize(){if(editor){const t=editor.input;t.style.height='auto';t.style.height=(t.scrollHeight+2)+'px';}}
window.addEventListener('resize',resize);
function peers(){
  if(!editor)return;
  const n=others(editor.pid).join('、');
  editor.peers.textContent=n?n+'もこの段落を書いている。あとから送ったほうの文が残り、前の文は履歴に入る。':'';
}
function start(id,kind){
  if(editor)return;
  const pid=kind==='edit'?id:session.ref.child('paras').push().key;
  const initial=kind==='edit'?session.data[id].t:'';
  const box=el('div',null,'editor'),input=el('textarea'),count=el('span',null,'meta'),warn=el('span',null,'warn');
  const send=btn(kind==='edit'?'書き換える':'書き足す',submit,'send','primary'), cancel=btn('やめる',()=>dismiss(),'cancel');
  const remote=el('div'),peer=el('div'),actions=el('div',null,'actions');
  editor={pid,anchor:id,kind,initial,input,box,remote,peers:peer,send};
  select(null);const node=session.nodes.get(id);showActions(id);
  if(kind==='edit'){node.querySelector('.prose').hidden=true;node.append(box);}
  else if(node)node.after(box);else rows.prepend(box);
  box.append(peer,remote,input,actions);actions.append(count,warn,send,cancel);input.value=initial;
  input.oninput=()=>{const {len,ok}=core.checkText(input.value);count.textContent=len.toLocaleString('en-US')+' / 4,000字';
    warn.textContent=ok?'':'4,000字を超えている。段落を分ける。';send.disabled=!ok || !!editor.busy;resize();};
  input.onkeydown=e=>{if(!e.isComposing && e.key==='Enter' && (e.ctrlKey||e.metaKey)){e.preventDefault();if(!send.disabled)submit();}};
  peers();input.oninput();input.focus();presence();
}
function dirty(){return editor && editor.initial!==editor.input.value;}
function dismiss(force=false){
  if(!editor)return true;
  if(!force && (editor.busy || (dirty() && !confirm('書きかけの文を捨てる？'))))return false;
  const {pid,box}=editor;box.remove();editor=null;
  const node=session?.nodes.get(pid);if(node){node.querySelector('.prose').hidden=false;visibility(pid);showActions(pid);}
  presence();return true;
}
async function submit(){
  const e=editor;if(!e || e.busy || !core.checkText(e.input.value).ok)return;
  const t=e.input.value;
  if(e.kind==='add' && !t){dismiss(true);return;}
  e.busy=true;e.send.disabled=true;e.input.readOnly=true;
  const ok=await save(e.pid,e.kind==='edit'&&!t?'del':e.kind,t,e.anchor);
  if(editor!==e)return;
  if(ok)dismiss(true);else{e.busy=false;e.input.readOnly=false;e.input.oninput();}
}
async function save(id,kind,text,anchor){
  const s=session,old=s.data[id],changes={};
  if(kind!=='add' && !old)return false;
  if((kind==='edit'||kind==='restore') && !old.del && old.t===text)return true;
  if(kind==='del' && old.del || kind==='undel' && !old.del)return true;
  let o=old?.o;
  if(kind==='add'){
    const pos=anchor?state.paras.findIndex(p=>p.id===anchor):-1;
    o=core.orderBetween(state.paras[pos]?.o,state.paras[pos+1]?.o);
  } else {
    changes['hist/'+id+'/'+s.ref.child('hist/'+id).push().key]={t:old.t,by:old.by,at:old.at};
  }
  const p={t:['undel','del'].includes(kind)?old.t:text,o,by:username,at:stamp};
  if(kind==='del')p.del=true;
  changes['paras/'+id]=p;
  try{
    s.local=id;
    const write=docUpdate(s,changes);s.local=null;await write;
    if(s===session){
      toast(({edit:'書き換えた',add:'書き足した',del:'段落を消した',undel:'段落を戻した',restore:'前の文に戻した'})[kind],
        kind==='del'?()=>save(id,'undel'):null);
    }
    return true;
  }catch{s.local=null;if(s===session)error();return false;}
}
async function historyPanel(id){
  const s=session;openPanel('この段落の履歴','sheet');const version=panelVersion;
  panel.append(el('strong','いまの文'),el('div',s.data[id].t,'prose'));
  try{
    const snap=await s.ref.child('hist/'+id).get();if(version!==panelVersion)return;
    const entries=Object.entries(snap.val()||{}).reverse().sort((a,b)=>b[1].at-a[1].at);
    if(!entries.length)panel.append(el('p','まだ書き換えられていない。'));
    for(const [,v] of entries){
      const entry=el('section',null,'entry');entry.append(el('div',v.by+'　'+core.fmtTime(v.at),'meta'),el('div',v.t,'prose'),
        btn('この文に戻す',()=>named(async()=>{if(await save(id,'restore',v.t))closePanel();}),'restore'));panel.append(entry);
    }
  }catch{if(version===panelVersion)error();}
}
function leave(){
  closePanel();hideToast();const s=session;session=null;
  if(s){for(const [ref,event,cb] of s.listeners)ref.off(event,cb);
    for(const item of s.flashes.values())clearTimeout(item.timer);
    s.me.remove().catch(error);}
  editor=null;selected=null;state.paras=[];state.pres=[];rows.replaceChildren();
}
function navigate(id,push=true){
  if(!dismiss())return false;
  if(push){const url=new URL(location.href);if(id)url.searchParams.set('n',id);else url.searchParams.delete('n');history.pushState(null,'',url);}
  route(id);return true;
}
async function gmPanel(){
  openPanel('GM の操作');const version=panelVersion;
  panel.append(el('h3','書ける人の名前'));
  const list=el('div'),input=el('input');panel.append(list,input);
  input.placeholder='PL の名前（20字まで）';input.maxLength=20;
  async function change(n,value){
    try{
      await gmUpdate({['names/'+n]:value,['gm/'+gmKey+'/names/'+n]:value});
      if(version===panelVersion){toast(value?'登録した':'外した');gmPanel();}
    }catch{error();}
  }
  const add=btn('登録する',()=>change(core.cleanName(input.value),true));
  input.oninput=()=>{const n=core.cleanName(input.value);add.disabled=!validName(n)||n==='GM'||n===gmKey;};
  input.oninput();panel.append(add);if(!state.nid)panel.append(btn('小説を足す',()=>titlePanel(true)));
  try{
    const names=(await db.ref('novel/gm/'+gmKey+'/names').get()).val()||{};
    if(version!==panelVersion)return;
    if(!Object.keys(names).length)list.append(el('p','まだ誰も登録されていない。'));
    for(const n of Object.keys(names)){
      const row=el('div',n);row.append(btn('外す',()=>change(n,null)));list.append(row);
    }
  }catch{error();}
}
$('#gm').onclick=gmPanel;
function titlePanel(create){
  const id=state.nid,item=index[id],isGM=state.role==='gm';
  openPanel(create?'小説を足す':'題を変える');
  const form=el('form'),title=el('input'),date=el('input');
  function field(label,input){const wrap=el('label',label);wrap.append(input);form.append(wrap);}
  title.maxLength=60;title.required=true;title.value=item?.title||'';field('題（60字まで）',title);
  if(isGM){date.type='date';date.value=item?.date||'';field('卓の日付',date);}
  const send=el('button',create?'足す':'変える','primary');form.append(send);panel.append(form);title.focus();
  form.onsubmit=async e=>{
    e.preventDefault();if(send.disabled||!title.value.trim())return;send.disabled=true;
    const key=create?'n'+Date.now().toString(36):id;
    const record=create?{order:Object.keys(index).length?Math.max(...Object.values(index).map(v=>v.order))+1:1}:{...index[id]};
    record.title=title.value.trim();record.by=username;
    if(isGM){if(date.value)record.date=date.value;else delete record.date;}
    try{
      if(isGM)await gmUpdate({['index/'+key]:record});else await db.ref('novel/index/'+key).set(record);
      closePanel();toast(create?'小説を足した':'題を変えた');
    }catch{error();send.disabled=false;}
  };
}
$('[data-act=retitle]').onclick=()=>named(()=>titlePanel(false));
function metadata(item){
  $('#heading').textContent=$('#title').textContent=item?.title||siteTitle;
  $('#date').textContent=core.fmtDate(item?.date);$('#date').hidden=!$('#date').textContent;
  $('[data-act=retitle]').hidden=!item;$('#title').classList.toggle('site',!item);
}
function catalog(){
  rows.replaceChildren();rows.className='catalog';
  for(const [key,v] of Object.entries(index).sort((a,b)=>a[1].order-b[1].order)){
    const b=btn(v.title,()=>navigate(key)),date=core.fmtDate(v.date);
    if(date)b.append(el('small',date,'meta'));rows.append(b);
  }
  if(!rows.childElementCount)rows.append(el('p','まだ小説がない。'));
}
function route(id){
  leave();state.nid=id;const item=id && Object.hasOwn(index,id)?index[id]:null;
  metadata(item);$('#intro').hidden=!id;
  $('#back').hidden=!id;$('#people').hidden=!item;$('[data-act=top]').hidden=!item;rows.className='';
  if(!id){catalog();return;}
  if(!item){$('#intro').textContent='この小説は見つからない。';rows.append(btn('一覧へ',()=>navigate(null)));return;}
  $('#intro').textContent='段落を押すと、書き換えたり書き足したりできる。';$('#people').textContent='読み込んでいる……';
  const ref=db.ref('novel/docs/'+id),s={ref,me:ref.child('pres/'+cid),listeners:[],data:Object.create(null),nodes:new Map(),flashes:new Map(),ready:false};
  session=s;
  function listen(path,event,cb){const r=ref.child(path);r.on(event,cb,error);s.listeners.push([r,event,cb]);}
  for(const event of ['child_added','child_changed'])listen('paras',event,snap=>receive(s,snap));
  listen('paras','child_removed',snap=>{
    const id=snap.key;if(session!==s)return;
    if(editor?.pid===id||editor?.anchor===id)dismiss(true);
    if(selected===id)selected=null;
    s.nodes.get(id)?.remove();s.nodes.delete(id);delete s.data[id];state.paras=core.sortParas(s.data);
  });
  // A one-shot barrier on the already subscribed query uses the same SDK listen.
  ref.child('paras').once('value').then(()=>s.ready=true,error);
  listen('pres','value',snap=>{
    const previous=state.pres;state.pres=Object.entries(snap.val()||{}).map(([id,v])=>({...v,id}));
    const names=state.pres.filter(p=>p.id!==cid).map(p=>p.n||'名前のない人');
    $('#people').textContent=names.length?'いま開いている人：'+names.join('、'):'いま開いているのは自分だけ';
    for(const pid of new Set([...previous,...state.pres].map(v=>v.p).filter(Boolean)))badges(pid);peers();
  });
  if(state.connected)arm(s);
}
$('#back').onclick=()=>navigate(null);
$('[data-act=top]').onclick=()=>{if(!editor)named(()=>start(null,'add'));};
document.addEventListener('click',e=>{if(!editor && !e.target.closest('article,dialog,button') && !getSelection()?.toString())select(null);});
document.addEventListener('keydown',e=>{if(e.key==='Escape' && !panel.open){if(editor)dismiss();else select(null);}});
window.addEventListener('beforeunload',e=>{if(dirty()){e.preventDefault();e.returnValue='';}});
window.addEventListener('popstate',()=>{
  if(!navigate(new URLSearchParams(location.search).get('n'),false)){
    const url=new URL(location.href);url.searchParams.set('n',state.nid);history.pushState(null,'',url);
  }
});
applyPrefs();
const identityReady=(async()=>{
  const n=core.cleanName(getPref('gm')||getPref('name')||'');
  if(n){try{identity(n,await verify(n));}catch{identity('','');}}
})();
let routed=false;
db.ref('novel/index').on('value',snap=>{
  index=snap.val()||{};
  const id=new URLSearchParams(location.search).get('n');
  if(!routed||id!==state.nid||!!session!==!!(id&&index[id])){routed=true;route(id);}
  else if(id)metadata(index[id]);else catalog();
},error);
</script></body></html>
