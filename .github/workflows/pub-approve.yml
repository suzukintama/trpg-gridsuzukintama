name: Approve public profile
on:
  workflow_dispatch:
    inputs:
      id:
        description: 'approve は id または id:ハッシュの先頭12桁。revoke は id のみ（ハッシュ付きは拒否）'
        required: true
        type: string
      op:
        description: Operation
        required: true
        type: choice
        options:
          - approve
          - revoke
permissions:
  contents: write
  pages: write
concurrency:
  group: pub-sync
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Update, commit and push changes
        id: update
        env:
          ID: ${{ inputs.id }}
          OP: ${{ inputs.op }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 0 1 2 3; do
            if [ "$attempt" -gt 0 ]; then
              git fetch origin main
              git reset --hard origin/main
            fi
            node scripts/pub_actions.mjs "$OP" "$ID"
            mkdir -p c data
            git add -- c data
            if git diff --cached --quiet; then exit 0; fi
            git commit -m 'Update approved public profiles'
            if git push origin HEAD:main; then
              echo 'pushed=true' >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          exit 1
      - name: Request Pages build
        if: steps.update.outputs.pushed == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST repos/${{ github.repository }}/pages/builds
