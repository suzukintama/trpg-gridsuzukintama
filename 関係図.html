<style>

#graph .node,#graph .relation-line,#graph .line-caption{transition:opacity 160ms ease}#graph .node{opacity:1}#graph .unconnected{opacity:.35}#graph .unconnected image{filter:grayscale(1)}#graph .node.dim{opacity:.2}#graph .relation-line{opacity:.45}#graph .relation-line.dim,#graph .line-caption.dim{opacity:.09}
#graph .node .body{fill:var(--node);stroke:#888;stroke-width:1.2}#graph .node .ring{fill:none;stroke:#999;stroke-width:1.2;pointer-events:none}#graph .centre .ring{stroke:var(--mag);stroke-width:2}#graph .active .ring{stroke:var(--cyan);stroke-width:2}#graph .node.active,#graph .node.arriving{opacity:1}#graph .active image,#graph .arriving image{filter:none}

 #graph .node{cursor:pointer}

@media(max-width:900px){header{top:12px;left:14px;max-width:45vw}#controls{top:62px;left:12px;right:12px;max-width:none;gap:0}#controls button,#controls select,#controls input{font-size:11px;padding:4px 6px}#controls input{width:105px}#more-menu{top:150px;right:12px}#panel.drawer{padding-top:160px}#panel.drawer #close{top:118px}}

<style id="polish">
/* Design pass (2026-11-11): one token set, one surface style, clear primary/secondary/danger actions. Overrides the base block above. */
:root{--radius:10px;--radius-s:6px;--line:#ffffff1f;--line-strong:#ffffff3d;--surface:#252527f2;--surface-2:#303034;--input:#19191b;--muted:#a3a3ab;--border:var(--line-strong);--accent:var(--cyan);--on-accent:#04191b;--shadow:0 14px 40px #00000080,0 2px 8px #00000059}
:root[data-bg="white"]{--line:#18212b1f;--line-strong:#18212b47;--surface:#fffffff5;--surface-2:#edf0f0;--input:#fff;--muted:#51626e;--border:var(--line-strong);--on-accent:#fff;--shadow:0 14px 40px #18212b2b,0 2px 8px #18212b21}
body{font:14px/1.65 "BIZ UDPGothic","Yu Gothic UI","Hiragino Sans",Meiryo,sans-serif;-webkit-font-smoothing:antialiased}

/* Buttons and fields */
button{border:1px solid var(--line-strong);border-radius:var(--radius-s);background:var(--surface-2);font-weight:600;min-height:40px;transition:background .12s,border-color .12s,opacity .12s}
button:hover{border-color:var(--accent)}
button[type=submit]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
button[type=submit]:hover{filter:brightness(1.08)}
button.danger{background:transparent;border-color:transparent;color:var(--mag)}
button.danger:hover{border-color:var(--mag)}
#close,#card-close,#more-close,#legend-close{position:absolute;top:12px;right:12px;bottom:auto;float:none;width:32px;min-height:32px;padding:0;border-radius:50%;border-color:transparent;background:transparent;font-size:18px;line-height:1;font-weight:400}
#close:hover,#card-close:hover,#more-close:hover,#legend-close:hover{background:var(--surface-2);border-color:var(--line)}
label{font-size:12px;font-weight:600;color:var(--muted);margin:14px 0 0}
input,textarea,select{color:var(--fg)}
input:not([type=checkbox]):not([type=range]),textarea,select{margin-top:4px;border:1px solid var(--line-strong);border-radius:var(--radius-s);background:var(--input);padding:8px 10px;font-weight:400;transition:border-color .12s}
input:not([type=checkbox]):not([type=range]):focus,textarea:focus,select:focus{border-color:var(--accent);outline:none}
input::placeholder,textarea::placeholder{color:var(--muted);opacity:.75}
input[type=checkbox],input[type=range]{accent-color:var(--accent)}
label:has(>input[type=checkbox]){display:flex;align-items:center;gap:10px;padding:9px 12px;border:1px solid var(--line);border-radius:var(--radius-s);font-size:13px;font-weight:500;color:var(--fg);cursor:pointer}
label{position:relative}
label>output.hint{position:absolute;top:0;right:0;margin:0;font-size:11px;font-weight:400;font-variant-numeric:tabular-nums}
.hint{font-size:11.5px;line-height:1.55;margin:5px 0 0}
[role=status]:empty{display:none}
#pl-key-error,#pl-pass-error,#gm-key-error{color:var(--mag);font-size:12px;margin:6px 0 0}
h2{font-size:16px;font-weight:700;line-height:1.4}
h3{font-size:11px;font-weight:700;color:var(--muted);letter-spacing:.06em;margin:14px 0 2px}
.field-text{margin:0}

/* Title card and tool bar */
#title-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
#back-home{pointer-events:auto;color:var(--fg);font-size:12px;text-decoration:none;border:1px solid var(--line-strong);border-radius:var(--radius-s);padding:6px 10px;min-height:34px;background:var(--surface-2)}
#back-home:hover{border-color:var(--accent)}
header{top:16px;left:20px;max-width:min(360px,calc(100dvw - 40px));padding:10px 16px 11px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);backdrop-filter:blur(16px);box-shadow:var(--shadow)}
h1{font-size:16px;font-weight:700;letter-spacing:.02em;line-height:1.4}
#mode{display:inline-block;margin:6px 0 0;padding:1px 9px;border:1px solid var(--line-strong);border-radius:999px;font-size:11px}
#message{margin:6px 0 0;color:var(--muted);line-height:1.55}
#controls{top:16px;right:20px;gap:4px;padding:6px;max-width:calc(100dvw - 420px);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
#controls button,#controls select{min-height:34px;padding:6px 10px;border-radius:var(--radius-s);font-weight:600;margin-top:0}
#controls select{background:transparent;border-color:transparent}
#controls label{margin:0 0 0 10px;padding-left:12px;border-left:1px solid var(--line);color:var(--muted);gap:2px}
#controls #motion{margin-left:10px}
#controls #search{width:160px;min-height:34px;margin:0 6px;padding:6px 14px;border:1px solid var(--line);border-radius:999px;background:var(--input)}
#controls #search:focus{border-color:var(--accent)}
#controls #add-npc{background:var(--accent);color:var(--on-accent)}
#controls #add-npc:hover{background:var(--accent);filter:brightness(1.08)}
#controls #more{border:1px solid var(--line)}
#more-menu{top:72px;right:20px;width:300px;padding:18px 18px 16px;border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
#more-menu button{min-height:36px}
#more-menu>button:first-child{float:none}
#more-menu>*:not(#more-close){margin-top:12px}

#more-menu form{padding-top:12px;border-top:1px solid var(--line)}
#more-menu form label{margin:0}
#more-menu form button{margin-top:10px;width:100%}
#more-menu #show-key,#more-menu #legend-open,#more-menu #unlist-pc{width:100%}
#more-menu #unlist{padding-top:12px;border-top:1px solid var(--line)}
#more-menu #unlist-pc{color:var(--mag);background:transparent}

/* Graph */
#graph .node .body{stroke:none}
#graph .node-name{font-size:13px;font-weight:600;stroke-width:5px}
#graph .centre .node-name{font-size:16px;font-weight:700}
#graph .centre .ring{stroke-width:3}
#graph .centre{filter:drop-shadow(0 0 14px color-mix(in srgb,var(--mag) 42%,transparent))}
#graph:not(.large) .node:not(.centre):not(.unconnected){filter:drop-shadow(0 3px 7px #00000066)}
#graph .line-short{font-weight:600}
#graph .initial{font-weight:700;fill:var(--muted)}

/* Card on a piece, line editor, drawer, dialogs */
dialog,#node-card,#line-editor{border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
dialog{padding:22px 24px 24px}
dialog h2,#node-card h2{margin:0 40px 14px 0;padding-bottom:12px;border-bottom:1px solid var(--line)}
dialog>p{margin:0 0 4px;font-size:13px;line-height:1.7}
#node-card{width:min(340px,calc(100dvw - 16px));padding:16px 16px 14px}
#node-card h2{font-size:15px;margin-bottom:4px;padding-bottom:10px}
#node-card label{margin:10px 0 0}
#panel.drawer{width:min(400px,92dvw);padding:22px 24px 28px;border-width:0 0 0 1px;border-radius:0;border-color:var(--line)}
#panel.drawer #close{top:16px;right:16px}
form>div:has(>#relation-gauge-slider){display:grid;grid-template-columns:1fr 96px;grid-template-areas:"l o" "h h" "s n" "w w";gap:6px 12px;align-items:center;margin-top:14px;padding:12px 12px 14px;border:1px solid var(--line);border-radius:var(--radius-s);background:var(--surface-2)}
form>div:has(>#relation-gauge-slider)>label{grid-area:l;margin:0}
form>div:has(>#relation-gauge-slider)>.hint{grid-area:h;margin:0}
form>div:has(>#relation-gauge-slider)>#relation-gauge{grid-area:n;margin:0;text-align:right;font-variant-numeric:tabular-nums}
form>div:has(>#relation-gauge-slider)>output{grid-area:o;text-align:right;font-size:20px;font-weight:700;line-height:1}
form>div:has(>#relation-gauge-slider)>.gauge-warning{grid-area:w;margin:0;line-height:1.55}
#relation-gauge-slider{grid-area:s;appearance:none;-webkit-appearance:none;height:6px;border-radius:3px;background:linear-gradient(90deg,var(--tone-hate),var(--tone-none) 50%,var(--tone-like));cursor:pointer}
#relation-gauge-slider::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;background:var(--fg);border:3px solid var(--input);box-shadow:0 1px 4px #0008}
#relation-gauge-slider::-moz-range-thumb{width:14px;height:14px;border-radius:50%;background:var(--fg);border:3px solid var(--input)}
form>.row{justify-content:space-between;margin:2px 0 0;font-size:11px;color:var(--muted)}
form>.row span{flex:none;min-width:0}
form>.row output{font-size:14px;font-weight:700;color:var(--fg)}
form #relation-save{position:sticky;bottom:0;z-index:1;width:100%;min-height:40px;margin-top:14px;font-size:14px;box-shadow:0 0 0 8px var(--surface),0 -14px 14px 4px var(--surface)}
form #relation-details,form #relation-delete{margin-top:8px;background:transparent}
form #relation-details{float:right}
#relation-reverse{clear:both;margin-top:18px;padding-top:2px;border-top:1px solid var(--line)}
#relation-reverse>h3:first-child{font-size:12px;color:var(--fg);letter-spacing:0;margin-top:12px}
#line-editor{width:min(320px,calc(100dvw - 16px));padding:12px}
#line-editor form{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
#line-editor #line-short{flex:1 1 100%;margin:0}
#line-editor output{margin:0 auto 0 0}
#pl-key-form,#pl-pass-form{margin-top:16px;padding-top:2px;border-top:1px solid var(--line)}
#pl-key-form button,#pl-pass-form button{margin-top:10px}
#pl-public-open{margin-top:18px}
#map-key{font-family:ui-monospace,Consolas,monospace;letter-spacing:.08em}
#map-key-copy{margin-top:10px}

/* First screen */
#home{inset:0;padding:112px max(20px,calc(50dvw - 360px)) 64px}
#home h2{font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.06em;margin:30px 0 8px}
#pl-entry{padding:16px 18px 18px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
#pl-entry-form{display:flex;align-items:flex-end;gap:10px}
#pl-entry-form label{flex:1;margin:0}
#pl-results h2{margin-top:18px}
#pl-results>p{margin:14px 0 0;color:var(--muted);font-size:13px}
.card{margin:6px 0;padding:8px 12px;border:1px solid var(--line);border-radius:var(--radius-s);background:var(--surface-2);transition:border-color .12s}
.card:hover{border-color:var(--line-strong)}
.card span{font-weight:600}
.card .face{flex:none;min-width:0;display:inline-grid;place-items:center;border:1px solid var(--line-strong);background:var(--node);color:var(--muted)}
.card button{min-height:36px}
.card label{margin:0;display:flex;align-items:center;gap:8px}
.card select{margin:0}

/* Notices */
#toast{bottom:28px;max-width:min(90vw,560px);padding:10px 22px;border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);font-weight:600;text-align:center}
#empty{bottom:28px;width:auto;max-width:min(90vw,600px);padding:10px 18px;background:var(--surface);border:1px solid var(--line);border-radius:14px;font-size:12.5px}
#legend{position:fixed;left:20px;bottom:20px;z-index:4;width:270px;padding:12px 44px 12px 14px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);backdrop-filter:blur(16px);box-shadow:var(--shadow)}
#legend-close{top:6px;right:6px}
.legend-scale{display:flex;align-items:center;gap:8px;font-size:11px;font-weight:700}
.legend-scale i{flex:1;height:6px;border-radius:3px;background:linear-gradient(90deg,var(--tone-hate),var(--tone-none) 50%,var(--tone-like))}
.legend-scale span:first-child{color:var(--tone-hate)}.legend-scale span:last-child{color:var(--tone-like)}
@media(max-width:900px){header{top:12px;left:12px;max-width:calc(100dvw - 24px);padding:8px 12px}#controls{top:64px;left:12px;right:12px;max-width:none}#controls #search{width:120px}#controls label{margin-left:4px;padding-left:8px}#controls #motion{margin-left:4px}#more-menu{top:156px;right:12px}#legend{left:12px;bottom:12px;width:min(270px,calc(100dvw - 24px))}#home{padding-top:120px}}
</style>
<style id="text-size">
#node-card,#panel{overflow-y:auto;overscroll-behavior:contain}
#node-card form{max-height:calc(100dvh - 150px);overflow-y:auto;padding:0 8px 12px}
#panel.drawer[open]{display:flex;flex-direction:column;overflow:hidden}
#panel.drawer>form{flex:1;min-height:0;overflow-y:auto;padding:0 8px 12px}

#node-card #card-close{position:sticky;top:0;float:right;z-index:3;background:var(--surface)}
.relation-field{margin:10px 0;border-bottom:1px solid var(--border);padding-bottom:8px}

.relation-field>summary::marker{content:''}

.relation-field:not([open])>summary{font-weight:400;text-decoration:underline}
.relation-field .field-text{white-space:pre-wrap;overflow-wrap:anywhere}
:root{--graph-font-scale:1;--ui-font-scale:1}
body{font-size:calc(14px * var(--ui-font-scale))}
h1,h2{font-size:calc(16px * var(--ui-font-scale))}
h3{font-size:calc(11px * var(--ui-font-scale))}
label{font-size:calc(12px * var(--ui-font-scale))}

.hint{font-size:calc(11.5px * var(--ui-font-scale))}
label>output.hint{font-size:calc(11px * var(--ui-font-scale))}
#controls button,#controls select,#controls input,#controls label,#more-menu button,#more-menu .hint,#message,#back-home,.gauge-warning,#pl-key-error,#pl-pass-error,#gm-key-error{font-size:calc(12px * var(--ui-font-scale))}

function fit(){
  if(!layer)return;
  if(svg.classed('phone')){
    // Fit measured display bounds, including screen-sized names, below the controls.
    // The model's radii, gauges and saved positions remain untouched.
    const w=$('graph').clientWidth,h=$('graph').clientHeight;
    const top=Math.max(90,$('controls').getBoundingClientRect().bottom+24),pad=18;
    const bottomLimit=$('legend').hidden?h:Math.min(h,$('legend').getBoundingClientRect().top-pad);
    for(let pass=0;pass<8;pass++){
      renderGraph(0);refreshGraphCollision();simulation.alpha(.35).tick(160);renderGraph(0);
      const boxes=[];layer.selectAll('.node').each(function(d){
        const b=this.getBBox(),s=this.transform.baseVal.consolidate().matrix.a;
        boxes.push({left:d.x+b.x*s,right:d.x+(b.x+b.width)*s,top:d.y+b.y*s,bottom:d.y+(b.y+b.height)*s});
      });
      const left=Math.min(...boxes.map(b=>b.left)),right=Math.max(...boxes.map(b=>b.right)),upper=Math.min(...boxes.map(b=>b.top)),bottom=Math.max(...boxes.map(b=>b.bottom));
      const k=Math.min(2,(w-2*pad)/(right-left),(bottomLimit-top-pad)/(bottom-upper));
      svg.call(zoom.transform,d3.zoomIdentity.translate(w/2-k*(left+right)/2,top+(bottomLimit-top-pad)/2-k*(upper+bottom)/2).scale(k));
    }
    renderGraph(0);return;
  }
  for(let pass=0;pass<8;pass++){
    renderGraph(0);refreshGraphCollision();simulation.alpha(.35).tick(160);renderGraph(0);
    const nodes=[];layer.selectAll('.node').each(function(d){
      const b=this.getBBox(),s=this.transform.baseVal.consolidate().matrix.a;
      nodes.push({...d,bounds:{x:b.x*s,y:b.y*s,width:b.width*s,height:b.height*s}});
    });
    const t=fitView(nodes,$('graph').clientWidth,$('graph').clientHeight);svg.call(zoom.transform,d3.zoomIdentity.translate(t.x,t.y).scale(t.k));
  }
  renderGraph(0);
}
